name: Premarket Stock Agent

on:
  schedule:
    # 週一至週五 08:15 (台灣時間 UTC+8) -> 台股盤前
    - cron: '15 0 * * 1-5'
    # 週一至週五 16:30 (台灣時間 UTC+8) -> 台股盤後 + 重大事件行事曆同步
    - cron: '30 8 * * 1-5'
    # 週一至週五 20:45 (台灣時間 UTC+8) -> 美股盤前
    - cron: '45 12 * * 1-5'
    # 週一至週五 06:30 (台灣時間 UTC+8，UTC 前一日 22:30) -> 美股盤後
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式 (premarket=盤前, afterhours=盤後, events=行事曆事件)'
        required: true
        default: 'premarket'
        type: choice
        options:
          - premarket
          - afterhours
          - events
      market:
        description: '選擇市場 (TW、US，或 events 模式可選 ALL)'
        required: true
        default: 'TW'
        type: choice
        options:
          - TW
          - US
          - ALL
      force:
        description: '是否忽略休市日或快取強制執行'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Stock Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_MARKET: ${{ github.event.inputs.market }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          FORCE_FLAG=""
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            MODE="$INPUT_MODE"
            MARKET="$INPUT_MARKET"
            if [ "$INPUT_FORCE" == "true" ]; then
              FORCE_FLAG="--force"
            fi
            python -u main.py --market "$MARKET" --mode "$MODE" $FORCE_FLAG
          elif [ "$EVENT_SCHEDULE" == "15 0 * * 1-5" ]; then
            python -u main.py --market TW --mode premarket
          elif [ "$EVENT_SCHEDULE" == "30 8 * * 1-5" ]; then
            python -u main.py --market TW --mode afterhours
            python -u main.py --market ALL --mode events
          elif [ "$EVENT_SCHEDULE" == "45 12 * * 1-5" ]; then
            python -u main.py --market US --mode premarket
          else
            python -u main.py --market US --mode afterhours
          fi

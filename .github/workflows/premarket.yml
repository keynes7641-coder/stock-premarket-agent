name: Premarket Stock Agent

# Schedule is triggered via external cron-job.org calling workflow_dispatch API.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (premarket, afterhours, events, afterhours_and_events)'
        required: true
        default: 'premarket'
        type: choice
        options:
          - premarket
          - afterhours
          - events
          - afterhours_and_events
      market:
        description: 'Market (TW, US, or ALL for events)'
        required: true
        default: 'TW'
        type: choice
        options:
          - TW
          - US
          - ALL
      force:
        description: 'Force run even on market holidays or cached events'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Stock Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_MARKET: ${{ github.event.inputs.market }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          FORCE_FLAG=""
          if [ "$INPUT_FORCE" == "true" ]; then
            FORCE_FLAG="--force"
          fi

          if [ "$INPUT_MODE" == "afterhours_and_events" ]; then
            python -u main.py --market "$INPUT_MARKET" --mode afterhours $FORCE_FLAG
            python -u main.py --market ALL --mode events $FORCE_FLAG
          else
            python -u main.py --market "$INPUT_MARKET" --mode "$INPUT_MODE" $FORCE_FLAG
          fi
